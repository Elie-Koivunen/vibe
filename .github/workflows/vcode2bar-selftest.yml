# vcode2bar: runs the built-in test suite on real Windows and Linux machines.
# Lives at the repo root because GitHub only runs workflows from <repo>/.github/workflows/;
# it only triggers when something under vcode2bar/ (or this file) changes.
# (Moved here from vcode2bar/.github/workflows/selftest.yml in vcode2bar 1.3.0.)
name: vcode2bar selftest

on:
  push:
    # branches only: GitHub ignores `paths` for tag pushes, so without this every tag
    # (e.g. bm4vlc-v0.2.0) would run this workflow too
    branches: ["**"]
    paths: ["vcode2bar/**", ".github/workflows/vcode2bar-selftest.yml"]
  pull_request:
    paths: ["vcode2bar/**", ".github/workflows/vcode2bar-selftest.yml"]
  workflow_dispatch:

env:
  WORKDIR: vcode2bar
  # official Finanssiala test invoice 1 (version 4)
  SAMPLE_CODE: "479440520200360820048831500000000868516259619897100612"

jobs:
  selftest:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, ubuntu-22.04]
        python: ["3.9", "3.12"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5         # v5 / v6: Node 24 (v4 / v5 used the deprecated Node 20)
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # zbar is libzbar0t64 on Ubuntu 24.04 and libzbar0 on 22.04
          sudo apt-get install -y xvfb libzbar0t64 || sudo apt-get install -y xvfb libzbar0
      - name: Python packages
        working-directory: ${{ env.WORKDIR }}
        run: python -m pip install -r requirements.txt
      - name: Components
        working-directory: ${{ env.WORKDIR }}
        run: python vcode2bar.py --deps
      - name: Self-test
        working-directory: ${{ env.WORKDIR }}
        run: |
          # Linux needs a virtual display for the GUI suite
          if [ "$RUNNER_OS" = "Linux" ]; then py="xvfb-run -a python"; else py="python"; fi
          set +e
          $py vcode2bar.py --selftest 2 2>&1 | tee "$RUNNER_TEMP/selftest.log"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            # show the failure on the run's summary page (job logs need a GitHub sign-in to read)
            msg=$(grep -v "PASS (" "$RUNNER_TEMP/selftest.log" | tail -n 60 | tr -d '\r' \
                  | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=vcode2bar selftest failed (${{ matrix.os }}, Python ${{ matrix.python }})::$msg"
            { echo '### vcode2bar selftest failed'; echo '```'; tail -n 80 "$RUNNER_TEMP/selftest.log"; echo '```'; } \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"
      - name: Install as a package (pip install . -> vcode2bar command)
        working-directory: ${{ env.WORKDIR }}
        run: |
          python -m pip install .
          cd "$RUNNER_TEMP"
          vcode2bar --version
          vcode2bar --decode "$SAMPLE_CODE" --lang en
          vcode2bar --batch "$GITHUB_WORKSPACE/$WORKDIR/docs/examples/batch_invoices.csv" --code-only \
            || test $? -eq 2    # the example file has one deliberately broken row
